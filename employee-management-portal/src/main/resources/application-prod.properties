# Production requires the exact Vercel origin and Neon JDBC credentials.
app.frontend-url=${FRONTEND_URL}
app.cors.include-localhost=false

# Cross-origin cookie auth requires HTTPS and SameSite=None.
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:None}

# Neon JDBC URLs must use sslmode=require. Prefer the pooled hostname for serverless deployments.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=30000

# Keep compatibility with the current schema; override with a migration-managed strategy when available.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
jwt.expiration=${JWT_EXPIRATION:3600000}
management.endpoint.health.show-details=never
